{% extends "base.html" %}
{% block content %}
<div class="mb-8">
  <h1 class="text-2xl font-bold">Sync</h1>
  <p class="text-gray-500 text-sm mt-1">Download new chapters from MangaDex</p>
</div>

<div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6 max-w-2xl">
  <div class="flex items-center gap-3 mb-6">
    <button id="sync-btn" onclick="startSync()"
            class="bg-violet-600 hover:bg-violet-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white text-sm font-medium px-5 py-2 rounded-lg transition-colors">
      Run Sync
    </button>
    <span id="sync-status" class="text-sm text-gray-500"></span>
  </div>

  <div id="output" class="hidden bg-slate-900 rounded-lg overflow-hidden">
    <div id="waiting-msg" class="flex items-center gap-2 px-4 py-3 text-slate-400 text-xs">
      <span class="inline-block w-2 h-2 rounded-full bg-violet-400 animate-pulse"></span>
      Contacting MangaDex and queuing downloads — this can take a minute…
    </div>
    <div id="lines" class="px-4 pb-4 font-mono text-xs leading-relaxed text-slate-100 space-y-0.5"></div>
  </div>
</div>

<script>
let source = null;

function startSync() {
  if (source) return;
  const btn = document.getElementById('sync-btn');
  const status = document.getElementById('sync-status');
  const output = document.getElementById('output');

  btn.disabled = true;
  status.textContent = 'Running…';
  output.classList.remove('hidden');
  document.getElementById('lines').innerHTML = '';
  document.getElementById('waiting-msg').classList.remove('hidden');

  source = new EventSource('/api/sync/stream');

  source.onmessage = function(e) {
    if (e.data === '[done]') {
      source.close();
      source = null;
      btn.disabled = false;
      status.textContent = 'Done.';
      document.getElementById('waiting-msg').classList.add('hidden');
      return;
    }
    document.getElementById('waiting-msg').classList.add('hidden');
    const lines = document.getElementById('lines');
    const line = document.createElement('div');
    line.textContent = e.data;
    if (e.data.includes('downloaded=') || e.data.includes('→')) line.classList.add('text-green-400');
    else if (e.data.includes('[warn]') || e.data.includes('error')) line.classList.add('text-yellow-400');
    else if (e.data.includes('up-to-date')) line.classList.add('text-slate-500');
    lines.appendChild(line);
    lines.scrollTop = lines.scrollHeight;
  };

  source.onerror = function() {
    source.close();
    source = null;
    btn.disabled = false;
    status.textContent = 'Connection lost.';
  };
}
</script>
{% endblock %}
