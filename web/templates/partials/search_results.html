{% for r in results %}
<div class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 hover:border-violet-400 hover:bg-violet-50 cursor-pointer transition-colors search-result"
     data-id="{{ r.id }}" data-title="{{ r.title }}">
  {% if r.cover_url %}
  <img src="{{ r.cover_url }}" class="w-10 h-14 object-cover rounded shrink-0" loading="lazy">
  {% else %}
  <div class="w-10 h-14 bg-gray-200 rounded shrink-0"></div>
  {% endif %}
  <div class="min-w-0">
    <div class="font-medium text-sm truncate">{{ r.title }}</div>
    <div class="text-xs text-gray-500 mt-0.5">
      {{ r.status }}{% if r.year %} · {{ r.year }}{% endif %}
    </div>
  </div>
</div>
{% else %}
<p class="text-sm text-gray-500 text-center py-4">No results found.</p>
{% endfor %}
