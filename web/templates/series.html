{% extends "base.html" %}
{% block content %}
<div class="mb-8">
  <h1 class="text-2xl font-bold">Add Series</h1>
  <p class="text-gray-500 text-sm mt-1">Search MangaDex and add a series to sync</p>
</div>

<div class="max-w-lg">
  <div class="bg-white rounded-xl shadow-sm border border-gray-100 p-6">

    <!-- Phase 1: pick manga -->
    <div id="phase1">
      <div class="mb-3">
        <input type="text" id="url-input" placeholder="Paste MangaDex URL or UUID…"
               class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400"
               oninput="handleUrlPaste(this.value)">
        <p id="url-status" class="text-xs mt-1 hidden"></p>
      </div>
      <div class="flex items-center gap-2 mb-3">
        <div class="flex-1 border-t border-gray-200"></div>
        <span class="text-xs text-gray-400">or search</span>
        <div class="flex-1 border-t border-gray-200"></div>
      </div>
      <input type="text" id="search-input" placeholder="Search MangaDex…"
             class="w-full border border-gray-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400 mb-3"
             hx-get="/api/search" hx-target="#search-results" hx-trigger="keyup changed delay:400ms" name="q">
      <div id="search-results" class="space-y-2 max-h-64 overflow-y-auto"></div>
    </div>

    <!-- Phase 2: setup form (loaded via fetch) -->
    <div id="phase2" class="hidden">
      <div id="setup-loading" class="flex items-center gap-2 text-xs text-gray-400 py-4">
        <span class="inline-block w-2 h-2 rounded-full bg-violet-400 animate-pulse"></span>
        Loading manga details…
      </div>
      <div id="setup-form"></div>
      <button type="button" onclick="resetToPhase1()"
              class="mt-3 text-xs text-gray-400 hover:text-gray-600">← Pick a different manga</button>
    </div>

  </div>
</div>

<script>
  const UUID_RE = /[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}/i;

  async function loadSetup(mangaId) {
    document.getElementById('phase1').classList.add('hidden');
    document.getElementById('phase2').classList.remove('hidden');
    document.getElementById('setup-loading').classList.remove('hidden');
    document.getElementById('setup-form').innerHTML = '';

    const resp = await fetch(`/api/manga/${mangaId}/setup`);
    document.getElementById('setup-loading').classList.add('hidden');
    document.getElementById('setup-form').innerHTML = await resp.text();
    htmx.process(document.getElementById('setup-form'));
  }

  function resetToPhase1() {
    document.getElementById('phase1').classList.remove('hidden');
    document.getElementById('phase2').classList.add('hidden');
    document.getElementById('setup-form').innerHTML = '';
    document.getElementById('url-input').value = '';
    document.getElementById('url-status').classList.add('hidden');
    document.getElementById('search-results').innerHTML = '';
  }

  async function handleUrlPaste(value) {
    const status = document.getElementById('url-status');
    const match = value.match(UUID_RE);
    if (!match) { status.classList.add('hidden'); return; }
    status.textContent = 'Found UUID, loading…';
    status.className = 'text-xs mt-1 text-gray-400';
    try {
      await loadSetup(match[0]);
    } catch(e) {
      status.textContent = '✗ Could not load manga';
      status.className = 'text-xs mt-1 text-red-500';
    }
  }

  document.getElementById('search-results').addEventListener('click', async function(e) {
    const card = e.target.closest('.search-result');
    if (!card) return;
    await loadSetup(card.dataset.id);
  });


</script>
{% endblock %}
