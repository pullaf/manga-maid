name: Build and push image

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pytest fastapi

      - run: pytest tests/ --ignore=tests/test_integration.py -v

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve image tags
        id: tags
        run: |
          VERSION="${{ steps.version.outputs.value }}"
          BASE="ghcr.io/pullaf/mangadex-kavita-sync"
          if [[ "$VERSION" == "dev" ]]; then
            echo "value=${BASE}:dev" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-beta* ]]; then
            # Beta pre-release: tag bare, v-prefixed, and floating :beta
            echo "value=${BASE}:${VERSION},${BASE}:v${VERSION},${BASE}:beta" >> "$GITHUB_OUTPUT"
          elif [[ "$VERSION" == *-* ]]; then
            # Other pre-release: tag bare and v-prefixed only
            echo "value=${BASE}:${VERSION},${BASE}:v${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${BASE}:${VERSION},${BASE}:latest" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ steps.version.outputs.value }}
          tags: ${{ steps.tags.outputs.value }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.ref_name }}"
          PRERELEASE_FLAG=""
          [[ "$VERSION" == *-* ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "$VERSION" \
            --title "$VERSION" \
            --generate-notes \
            $PRERELEASE_FLAG
