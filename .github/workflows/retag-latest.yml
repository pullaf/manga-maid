name: Retag latest
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote to :latest (without v)"
        required: true
jobs:
  retag:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker pull ghcr.io/pullaf/mangadex-kavita-sync:${{ github.event.inputs.version }}
          docker tag  ghcr.io/pullaf/mangadex-kavita-sync:${{ github.event.inputs.version }} ghcr.io/pullaf/mangadex-kavita-sync:latest
          docker push ghcr.io/pullaf/mangadex-kavita-sync:latest
